# 2026.7.14+ is required, not just preferred: before it, the npm backend wrote
# `allow_builds` into the generated manifest as a JSON array, but aube reads
# `allowBuilds` as a package-name → bool map and rejects the array under
# `strictDepBuilds` (which `paranoid` turns on). Every npm tool here with a
# non-empty allow_builds would fail to install. Fixed by jdx/mise#11262.
min_version = "2026.7.17"

[settings]
experimental = true
paranoid = true
lockfile = true
minimum_release_age = "15d"
lockfile_platforms = ["macos-arm64"]
pin = true
prefer_offline = true
# TODO: revisit and add terragrunt/mate/whatever once I figure out IaC strategy
idiomatic_version_file_enable_tools = ["deno", "go", "node", "python", "rust", "terraform"]
trusted_config_paths = [
  "~/.repos/github.com/themaxdavitt/mise.toml",
  "~/.repos/github.com/tmd-x/mise.toml",
]
npm.package_manager = "aube"
# Python equivalent isn't necessary if you never install `pipx` :)

# https://github.com/suzuki-shunsuke/ghtkn/blob/v0.2.6/README.md#rocket-getting-started

# # Will become default after 2027.6.0
# auto_env = true
# auto_install = false
# # Will become default in future release
# env_shell_expand = true
# minimum_release_age_excludes = []

# trusted_config_paths = []
# use_versions_host = false
# TODO: investigate `unix_default_inline_shell_args`, `use_file_shell_for_executable_tasks`, `github.credential_command`, `github.gh_cli_tokens`, `gpg_verify`
# TODO: add all new entries to above TODO comment unless we really want to set them
#

[bootstrap.packages]
"brew:dnscrypt-proxy" = "latest"

[bootstrap.hooks.post-tools]
run = [
  'sudo mkdir -p /Library/Caches/dnscrypt-proxy /Library/Application\ Support/dnscrypt-proxy',
  'cd /Library/Application\ Support/dnscrypt-proxy && sudo dnscrypt-proxy -service install',
  # Depends on `chezmoi apply`
  "sudo dnscrypt-proxy -service start",
]

[tools]
"aqua:jdx/aube" = "1.24.0"
"aqua:astral-sh/uv" = "0.11.22"
# Password vault CLI
# https://github.com/bitwarden/clients/issues/20703 https://github.com/bitwarden/clients/issues/20705 :/
# also no `devEngines.runtime` so this may break someday
"npm:@bitwarden/cli" = { version = "2026.1.0", minimum_release_age = "2026-02-06T00:00:00Z", allow_builds = [
  "core-js",
], depends = [
  "aqua:jdx/aube",
] }
# Bridges Pi and Zed
"npm:pi-acp" = { version = "0.0.31", minimum_release_age = "2026-06-25T01:30:00Z", depends = [
  "aqua:jdx/aube",
] }
# Fun, extensible coding agent harness
# https://github.com/earendil-works/pi/blob/main/packages/coding-agent/CHANGELOG.md
"npm:@earendil-works/pi-coding-agent" = { version = "0.83.0", minimum_release_age = "2026-07-30T00:00:00Z", allow_builds = [
  "@google/genai",
  "protobufjs",
], depends = [
  "aqua:jdx/aube",
] }
# https://github.com/eugene1g/agent-safehouse/blob/main/CHANGELOG.md
"github:eugene1g/agent-safehouse" = { version = "0.10.1", asset_pattern = "safehouse.sh", bin = "safehouse" }
"npm:@tobilu/qmd" = { version = "2.5.3", minimum_release_age = "2026-06-11T01:30:00Z", allow_builds = [
  "better-sqlite3",
  "node-llama-cpp",
  "tree-sitter-go",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
], depends = [
  "aqua:jdx/aube",
] }
"aqua:rclone/rclone" = "1.74.2"
# encrypted/remote secret manager (age-backed); repeated-resolve caching daemon added v1.27.0
# https://github.com/jdx/fnox/blob/main/CHANGELOG.md
"github:jdx/fnox" = { version = "1.31.0", minimum_release_age = "2026-07-17T00:00:00Z" }
# https://github.com/git-lfs/git-lfs/releases
"aqua:git-lfs/git-lfs" = "3.7.1"
# https://github.com/huggingface/xet-core/releases?q=git-xet&expanded=true
"github:huggingface/xet-core" = { version = "0.2.1", version_prefix = "git-xet-v", bin = "git-xet" }
# https://github.com/yt-dlp/yt-dlp/releases
"pipx:yt-dlp" = { version = "2026.06.09", minimum_release_age = "2026-06-11T01:30:00Z", extras = "default,curl-cffi", depends = [
  "aqua:astral-sh/uv",
] }
# Nicer `grep`
"aqua:BurntSushi/ripgrep" = "15.1.0"
"github:boyter/cs" = "3.1.0"
"aqua:boyter/scc" = "3.7.0"
# OSS Semgrep fork
"aqua:opengrep/opengrep" = "1.22.0"
# Nicer `find`
"aqua:sharkdp/fd" = "10.4.2"
# doesn't have `requires-python`..?
"pipx:ffsubsync" = { version = "0.4.32", minimum_release_age = "2026-06-11T01:30:00Z", uvx_args = "--python 3.14", depends = [
  "aqua:astral-sh/uv",
] }
"aqua:suzuki-shunsuke/ghtkn" = "0.2.6"
"aqua:starship/starship" = "1.25.1"
"aqua:max-sixty/worktrunk" = "0.60.0"
"github:always-further/nono" = "0.65.1"
"aqua:anthropics/claude-code" = "2.1.219"
"github:michel-kraemer/zsh-patina" = "1.8.0"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:dandavison/delta" = "0.19.2"
"aqua:cli/cli" = "2.95.0"
"aqua:TomWright/dasel" = "3.11.1"
"aqua:koalaman/shellcheck" = "0.11.0"
# TODO: re-run `,cza`
# "github:backnotprop/plannotator" = "0.21.1"
# Using NPM here instead of Aqua so for `skills` subcommand
"npm:agent-browser" = { version = "0.31.2", minimum_release_age = "2026-07-21T00:00:00Z", allow_builds = [
  "agent-browser",
], depends = [
  "aqua:jdx/aube",
] }
# Session attach/detach for the terminal (dtach-style persistence)
# https://github.com/neurosnap/zmx/releases
"github:neurosnap/zmx" = "0.6.0"
"aqua:restic/restic" = "0.19.1"
"aqua:twpayne/chezmoi" = "2.70.2"

node = "lts"
python = "3"

# For `yt-dlp`
