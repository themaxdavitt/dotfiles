# Consumer agent: represents the deployed model that receives agent guidance.
# Used by `eval` subcommand to run behavioral ablation: the consumer is run
# with and without the skill body, and grader scripts inspect the output.
# List every consumer model you actually deploy — ,llint eval reports a
# per-model verdict alongside the aggregate, so a stronger model's redundancy
# can coexist with a weaker model's need. Delete guidance only when every
# deployed consumer reports it redundant.
models:
  # Subscription/work-accessible consumers (2026-07-06 refresh).
  - moonshotai/kimi-k2.7-code
  - z-ai/glm-5.2
  # gpt-5.5 is available but double the price — not worth it for ablation.
  - openai/gpt-5.4
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-4.8
  # Strongest actually-deployed consumer (Claude Code) — redundant here means
  # the text is pure token rent where it's read most.
  - anthropic/claude-fable-5
instructions: >-
  You are a capable AI assistant. Answer the given task directly and concisely.
  When asked to write a plan, outline the steps you would take.
retries: 2
