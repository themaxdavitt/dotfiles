[tasks]
check = "hk check"
# Paid + network LLM judge lane (`llm` hk profile); cached in ~/.cache/llint/
check-llm = "hk check --profile llm"
fix = "hk fix"
# name = "uv run --locked tools/name.py $@"

# Ablation-driven rewriting, gated on the judge. Sequencing is the whole point: a leaky
# eval prompt reaches the without-guidance run too, which lifts the baseline and
# manufactures a "redundant" verdict. That verdict now DELETES the directive rather than
# merely reporting on it, so the judge lane runs FIRST and a failure aborts before a
# single paid call. This rewrites files in place — pass --dry-run to measure only, and
# expect to review the diff either way.
# Usage: mise run improve [--dry-run|--flags...] <skill-dir|guidance.md>...
#        (no targets = every target with evals)
[tasks.improve]
description = "Judge-check guidance + eval prompts, then ablate/compress targets with evals"
run = """
set -euo pipefail
hk check --profile llm
flags=""
targets=""
for arg in "$@"; do
  case "$arg" in
    -*) flags="$flags $arg" ;;
    *) targets="$targets $arg" ;;
  esac
done
if [ -z "$targets" ]; then
  targets="$(find .claude/skills dot_claude/skills -maxdepth 2 -type d -name evals \
    -exec dirname {} \\; 2>/dev/null | sort -u) AGENTS.md"
fi
for t in $targets; do
  printf '\\n########## %s ##########\\n' "$t"
  # shellcheck disable=SC2086 # flags are deliberately word-split
  ,llint improve $flags "$t"
done
"""

# TODO: audit based on final `hk.pkl`, it would be nice to make this as lean as possible
[tools]
"aqua:editorconfig-checker/editorconfig-checker" = "3.7.0"
"aqua:jdx/hk" = "1.48.0"
"aqua:koalaman/shellcheck" = "0.11.0"
# TODO: remove b.c. it's probably redundant here, but see what's worth learning from it first
"npm:@contextlint/cli" = { version = "1.1.1", aube_args = "--allow-low-downloads" }
"aqua:lycheeverse/lychee" = "0.24.2"
"npm:markdownlint-cli" = "0.49.0"
"aqua:jackchuka/mdschema" = "0.13.2"
"aqua:rvben/rumdl" = "0.2.18"
"aqua:mvdan/sh" = "3.13.1"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:apple/pkl" = "0.31.1"
"aqua:astral-sh/ruff" = "0.15.17"
"aqua:astral-sh/ty" = "0.0.50"
"aqua:betterleaks/betterleaks" = "1.6.1"
"aqua:vale-cli/vale" = "3.15.1"
"github:agent-sh/agnix" = "0.36.2"

[tools.oxlint]
version = "apps_v1.69.0"
matching = "oxlint"
rename_exe = "oxlint"

[tools.oxfmt]
version = "apps_v1.69.0"
matching = "oxfmt"
rename_exe = "oxfmt"

[tool_alias]
oxlint = "github:oxc-project/oxc"
oxfmt = "github:oxc-project/oxc"

[env]
HK_MISE = 1
HK_PKL_BACKEND = "pkl"

[hooks]
postinstall = "hk install --mise"
