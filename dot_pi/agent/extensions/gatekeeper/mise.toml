# Dev-only task runner for this extension (`.chezmoiignore` keeps it out of the
# deployed target). No `[tools]` section on purpose: nested configs inherit the
# repo root's toolchain, so tool pinning stays in one file.
#
# One-time per checkout: `mise trust` this file — mise trusts config files
# individually, and trusting the repo root does not cover it.

[tasks.deps]
description = "Frozen-lockfile install (build scripts skipped via pnpm.allowBuilds)"
run = "aube ci"

[tasks.test]
description = "Unit tests (node:test via tsx); needs `nono` on PATH or gate probes soft-skip"
run = "./node_modules/.bin/tsx --test 'test/**/*.test.ts'"

[tasks.bundle]
description = "esbuild sanity check — the only type-adjacent check available outside Pi"
run = """
./node_modules/.bin/esbuild index.ts --bundle --platform=node --format=esm --outfile=/dev/null \
  --external:@earendil-works/pi-coding-agent \
  --external:@earendil-works/pi-tui \
  --external:typebox \
  --external:tree-sitter-bash \
  --external:web-tree-sitter
"""

# Deliberately NOT named `check`: the repo root defines `check = "hk check"` and
# a task of the same name here would shadow the lint lane AGENTS.md names, for
# every command run from this directory.
[tasks.ci]
description = "Runs test + bundle: what a change must pass before it is claimed to work"
depends = ["test", "bundle"]
